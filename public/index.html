<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem("kingindex-theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){}})();</script>
<title>KingIndex — Same paycheck. Different class.</title>
<meta name="description" content="Compare what the same salary buys across countries using World Bank PPP.">
<style>
:root{color-scheme:light;--bg:#f3f4f6;--panel:#fff;--panel2:#eef0f4;--border:#d0d5de;--text:#1a1f2a;--muted:#5a6678;--accent:#1a56a8;--gold:#a67c00;--shadow:0 2px 8px #0f172a0d;--thead:#e8ecf2}
[data-theme=dark]{color-scheme:dark;--bg:#0b0e13;--panel:#12171f;--panel2:#18202b;--border:#243041;--text:#e6edf5;--muted:#8b9bb0;--accent:#3d9cf0;--gold:#e6b84d;--shadow:none;--thead:#161d28}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:18px 18px 48px}header{display:flex;align-items:center;gap:16px;margin-bottom:16px}h1{font-size:1.4rem;margin:0}header span{color:var(--muted);flex:1}.theme-toggle{width:auto!important;padding:7px 11px!important;background:var(--panel)!important;color:var(--muted)!important;border:1px solid var(--border)!important;cursor:pointer!important}section,.summary,.card,.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;padding:14px;margin-bottom:10px;align-items:end}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls .full{grid-column:1/-1}}label{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}input,select,button{width:100%;min-width:0;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:9px 10px;font:inherit}button{cursor:pointer}.primary{background:linear-gradient(#2a6fc9,#1a56a8);border:0;color:#fff;font-weight:700}.hint,.note,.caveat{color:var(--muted);font-size:.8rem}.summary{padding:14px 16px;margin:14px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}}.card{padding:14px}.card h2{font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:0 0 8px}.metric{margin:8px 0}.metric .k{font-size:.7rem;color:var(--muted);text-transform:uppercase}.metric .v{font-size:1.12rem;font-weight:650}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.82rem}th{background:var(--thead);color:var(--muted);text-align:left;font-size:.7rem;text-transform:uppercase;padding:8px}td{padding:7px 8px;border-bottom:1px solid var(--border)}.hidden{display:none}.err{color:#d14b43;padding:14px;text-align:center}.band{color:var(--gold);font-weight:700}
</style></head>
<body><main><header><h1>KingIndex</h1><span>Same paycheck. Different class.</span><button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark theme">☾ Dark</button></header>
<div class="controls" id="controls"><div><label for="income">Annual income</label><input id="income" value="80,000" inputmode="decimal"></div><div><label for="itype">Income type</label><select id="itype"><option>Net (take-home)</option><option>Gross</option></select></div><div><label for="home">Home country</label><select id="home"><option value="USA">United States</option></select></div><div><label for="dest">Destination</label><select id="dest"><option value="">All countries</option></select></div><div class="full"><label>&nbsp;</label><button class="primary" id="rankBtn" type="button">Compare</button></div></div>
<p class="hint" id="currencyHint">Income is annual, in the home country's currency.</p><p class="caveat">Country-level consumption prices. Not rent, tax, visa, or school fees.</p><div id="status" class="err hidden"></div><div id="results" class="hidden"><div class="summary" id="summaryText"></div><div class="cards"><div class="card" id="homeCard"></div><div class="card" id="destCard"></div></div><div class="table-wrap"><table><thead><tr><th>Country</th><th>Price level</th><th>Local equivalent</th><th>Rank</th></tr></thead><tbody id="tbody"></tbody></table></div></div><p class="note" id="metaNote"></p></main>
<script>
(function(){"use strict";var DATA=null,byIso={};var $=function(id){return document.getElementById(id)};function money(n,c){return isFinite(n)?Math.round(n).toLocaleString()+" "+(c||""):"—"}function income(){return parseFloat($("income").value.replace(/[^\d.]/g,""))||0}function populate(){var cs=(DATA.countries||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name)});cs.forEach(function(c){byIso[c.iso3]=c;var o=document.createElement("option");o.value=c.iso3;o.textContent=c.name+" ("+c.iso3+")";$("dest").appendChild(o);if(c.iso3!=="USA"){var h=o.cloneNode(true);$("home").appendChild(h)}});if(byIso.USA){$("home").value="USA"}$("metaNote").textContent="Snapshot: "+(DATA.meta&&DATA.meta.generated_at||"local")+" · "+cs.length+" countries";compare()}function compare(){if(!DATA)return;var n=income(),h=byIso[$("home").value],d=byIso[$("dest").value];if(!h||!n){$("status").textContent="Select a home country and enter a positive income.";$("status").classList.remove("hidden");return}$("status").classList.add("hidden");$("results").classList.remove("hidden");var ppp=n/(h.ppp||1),lead=n.toLocaleString()+" "+$("itype").value+" in "+h.name;$("summaryText").textContent=lead+(d?" · same purchasing power in "+d.name:" · compare purchasing power worldwide");$("homeCard").innerHTML="<h2>Home · "+h.name+"</h2><div class=metric><div class=k>Income</div><div class=v>"+money(n,h.currency)+"</div></div><div class=metric><div class=k>PPP purchasing power</div><div class=v>about $"+Math.round(ppp).toLocaleString()+" Int$</div></div>";$("destCard").innerHTML=d?"<h2>Destination · "+d.name+"</h2><div class=metric><div class=k>PPP equivalent</div><div class=v>"+money(ppp*(d.ppp||1),d.currency)+"</div></div><div class=metric><div class=k>Price level vs US</div><div class=v>"+Math.round((d.pli_us||0)*100)+"</div></div>":"<h2>Destination</h2><div class=metric><div class=v>Choose a destination for a direct comparison.</div></div>";var rows=DATA.countries.map(function(c){return {c:c,eq:ppp*(c.ppp||1),pli:(c.pli_us||0)*100}}).filter(function(r){return r.c.pli_us&&r.c.ppp}).sort(function(a,b){return a.pli-b.pli}).slice(0,25);$("tbody").innerHTML=rows.map(function(r){return "<tr><td>"+r.c.name+" <small>"+r.c.iso3+"</small></td><td>"+Math.round(r.pli)+"</td><td>"+money(r.eq,r.c.currency)+"</td><td class=band>"+(r.pli<50?"Comfortable":"Compare")+"</td></tr>"}).join("")}$("rankBtn").addEventListener("click",compare);$("home").addEventListener("change",compare);$("dest").addEventListener("change",compare);$("income").addEventListener("change",compare);function apply(t){t=t==="dark"?"dark":"light";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("kingindex-theme",t)}catch(e){}$("themeToggle").textContent=t==="dark"?"☀ Light":"☾ Dark";$("themeToggle").setAttribute("aria-label","Switch to "+(t==="dark"?"light":"dark")+" theme")}$("themeToggle").addEventListener("click",function(){apply(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark")});apply(document.documentElement.getAttribute("data-theme"));fetch("./data/countries.json").then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(x){DATA=x;populate()}).catch(function(){$("status").textContent="Drop data/countries.json next to index.html";$("status").classList.remove("hidden")})})();
</script></body></html>
